<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b35d5"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Customer invoice · BizKipe</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><style>
*{box-sizing:border-box}.paper,td,th{overflow-wrap:anywhere}body{margin:0;background:#f7f6fb;color:#211d32;font:15px/1.55 system-ui}.wrap{width:min(780px,94%);margin:35px auto}.paper{background:#fff;border:1px solid #e8e4f0;border-radius:18px;padding:clamp(18px,4vw,38px);box-shadow:0 8px 30px #211d320b}.top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;border-bottom:3px solid #5b35d5;padding-bottom:18px}.muted{color:#716b82}.pill{background:#eee9ff;border-radius:20px;padding:5px 10px;font-weight:750;font-size:.8rem;text-transform:capitalize}table{width:100%;border-collapse:collapse;margin:22px 0}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #e8e4f0}th:last-child,td:last-child{text-align:right}.totals{max-width:320px;margin-left:auto}.totals div{display:flex;justify-content:space-between;padding:5px}.grand{font-size:1.2rem;font-weight:850;border-top:2px solid #5b35d5;margin-top:7px;padding-top:10px!important}.notice{background:#f2efff;padding:13px;border-radius:11px;margin-top:20px}.error{background:#fff0ef;color:#922f27;padding:18px;border-radius:12px}.actions{margin:14px 0}.btn{border:0;border-radius:9px;padding:10px 14px;background:#5b35d5;color:white;font-weight:750}@media print{body{background:white}.wrap{width:100%;margin:0}.paper{box-shadow:none;border:0}.actions{display:none}}
</style></head><body><main class="wrap"><div id="message" class="notice">Loading invoice…</div><article id="invoice" class="paper" hidden><header class="top"><div><h2 id="business" style="margin:0">Business</h2><div id="businessInfo" class="muted"></div></div><div style="text-align:right"><h1 style="margin:0;color:#5b35d5">INVOICE</h1><strong id="number"></strong><div id="dates" class="muted"></div><p><span id="state" class="pill"></span></p></div></header><section style="margin-top:22px"><strong>Bill to</strong><div id="customer"></div><div id="customerEmail" class="muted"></div></section><table><thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th>Amount</th></tr></thead><tbody id="items"></tbody></table><section class="totals"><div><span>Subtotal</span><strong id="subtotal"></strong></div><div><span>Discount</span><strong id="discount"></strong></div><div><span>Tax</span><strong id="tax"></strong></div><div class="grand"><span>Total</span><strong id="total"></strong></div><div><span>Amount paid</span><strong id="paid"></strong></div><div class="grand"><span>Balance due</span><strong id="balance"></strong></div></section><p id="notes" class="notice" hidden></p><div class="actions"><button class="btn" onclick="window.print()">Print / Save PDF</button></div><p class="muted" style="font-size:.8rem">This is a read-only invoice view. Payment records and status are provided by the business and are not independently verified by BizKipe.</p></article></main><script>
(async()=>{'use strict';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=(n,c)=>new Intl.NumberFormat('en-KE',{style:'currency',currency:c||'KES',maximumFractionDigits:2}).format(Number(n)||0);try{const token=new URLSearchParams(location.search).get('token');if(!token)throw Error('Invoice link is missing a token.');if(!window.BIZKIPE_SUPABASE_URL||!window.BIZKIPE_SUPABASE_ANON_KEY||!window.supabase)throw Error('Invoice viewing is temporarily unavailable.');const db=window.supabase.createClient(window.BIZKIPE_SUPABASE_URL,window.BIZKIPE_SUPABASE_ANON_KEY);const {data,error}=await db.rpc('bizkipe_public_invoice',{p_token:token});if(error)throw error;if(!data?.ok)throw Error(data?.message||'Invoice unavailable.');const d=data.invoice,c=d.currency||'KES';$('business').textContent=d.business_name||'Business';$('businessInfo').textContent=[d.business_address,d.business_email,d.business_phone].filter(Boolean).join(' · ');$('number').textContent=d.document_number||d.title||'Invoice';$('dates').textContent='Issued: '+(d.issue_date||'—')+' · Due: '+(d.due_date||'—');$('state').textContent=d.payment_state||d.status||'unpaid';$('customer').textContent=d.client_name||'Customer';$('customerEmail').textContent=d.client_email||'';const items=Array.isArray(d.items)?d.items:[];$('items').innerHTML=items.map(i=>{const q=Number(i.qty)||0,p=Number(i.price)||0;return `<tr><td>${esc(i.desc||'Item')}</td><td>${q}</td><td>${esc(money(p,c))}</td><td>${esc(money(q*p,c))}</td></tr>`}).join('')||'<tr><td colspan="4">Invoice items are not available.</td></tr>';$('subtotal').textContent=money(d.subtotal,c);$('discount').textContent=money(d.discount,c);$('tax').textContent=(Number(d.tax_rate)||0)+'%';$('total').textContent=money(d.total,c);$('paid').textContent=money(d.amount_paid,c);$('balance').textContent=money(d.balance,c);if(d.notes){$('notes').textContent=d.notes;$('notes').hidden=false}$('message').hidden=true;$('invoice').hidden=false}catch(e){$('message').className='error';$('message').textContent=e.message||'Could not load this invoice.'}})();
</script></body></html>
